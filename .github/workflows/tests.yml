name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolshop:
    name: Toolshop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      API_URL: ${{ vars.API_URL }}
      CUSTOMER2_EMAIL: ${{ secrets.CUSTOMER2_EMAIL }}
      CUSTOMER2_PASSWORD: ${{ secrets.CUSTOMER2_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check Actions configuration
        run: |
          missing=0
          for name in BASE_URL API_URL CUSTOMER2_EMAIL CUSTOMER2_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing $name::Add $name under Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          exit "$missing"

      - name: Write env file
        run: |
          mkdir -p env
          cat > env/.env << EOF
          BASE_URL=${BASE_URL}
          API_URL=${API_URL}
          CUSTOMER2_EMAIL=${CUSTOMER2_EMAIL}
          CUSTOMER2_PASSWORD=${CUSTOMER2_PASSWORD}
          EOF

      - name: Stage 1 — API
        run: npm run test:api

      - name: Stage 2 — API and UI
        run: npm run test:api-ui

      - name: Stage 3 — Checkout
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
